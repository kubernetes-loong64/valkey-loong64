name: loong64
on:
  push:
    branches:
      - loong64-*
    tags:
      - release-loong64-*
  pull_request:
    branches:
      - loong64-*

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NAMESPACE: ${{ vars.NAMESPACE || 'kubernetesloong64' }}
      VALKEY_REF: 2a88faed
    strategy:
      fail-fast: false
      matrix:
        base:
          - os: debian
            base_image: lcr.loongnix.cn/debian:14
          - os: debian-slim
            base_image: lcr.loongnix.cn/debian:14-slim
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Print branch name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.base_ref }} (PR target)"
          else
            echo ${{ github.ref_name }}
          fi
      - name: Extract valkey branch
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF=${{ github.base_ref }}
          else
            REF=${{ github.ref_name }}
          fi
          echo "REF=$REF"
          RAW_VERSION=$(echo $REF | awk -F'loong64-' '{print $2}')
          echo "RAW_VERSION=$RAW_VERSION"
          echo "RAW_VERSION=$RAW_VERSION" >> ${GITHUB_ENV}
          VALKEY_BRANCH=$(echo $RAW_VERSION | awk -F'+' '{print $1}')
          echo "VALKEY_BRANCH=$VALKEY_BRANCH"
          echo "VALKEY_BRANCH=$VALKEY_BRANCH" >> ${GITHUB_ENV}
          FOLDER=$(echo $VALKEY_BRANCH | awk -F'.' '{print $1"."$2}')
          echo "FOLDER=$FOLDER"
          echo "FOLDER=$FOLDER" >> ${GITHUB_ENV}
      - name: Clone valkey-container
        run: |
          git clone https://github.com/valkey-io/valkey-container.git
          cd valkey-container
          git checkout ${{ env.VALKEY_REF }}
          cd ${{ env.FOLDER }}/$(echo ${{ matrix.base.os }} | awk -F'-' '{print $1}')
          VERSION=$(grep 'ADD "https://github.com/valkey-io/valkey/archive/refs/tags/' Dockerfile | head -1 | sed 's|.*/tags/||; s|\.tar\.gz.*||')
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> ${GITHUB_ENV}
      - name: Validate valkey version
        run: |
          if [ "${{ env.VERSION }}" = "${{ env.VALKEY_BRANCH }}" ]; then
            echo "✅ VERSION (${{ env.VERSION }}) matches VALKEY_BRANCH (${{ env.VALKEY_BRANCH }})"
          else
            echo "❌ VERSION (${{ env.VERSION }}) does NOT match VALKEY_BRANCH (${{ env.VALKEY_BRANCH }})"
            exit 1
          fi
      - name: Apply patches
        working-directory: valkey-container
        run: git apply ../${{ env.FOLDER }}/*.patch
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Login to Docker
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        if: github.event_name == 'push'
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build image
        working-directory: valkey-container
        run: |
          cd ${{ env.FOLDER }}
          is_push=${{ github.event_name == 'push' && '--push' || '--load' }}
          docker buildx build \
            --no-cache \
            -f "debian/Dockerfile" \
            $is_push \
            --build-arg "BASE_IMAGE=${{ matrix.base.base_image }}" \
            --platform linux/loong64 \
            -t "${{ env.NAMESPACE }}/valkey-loong64:${{ env.VALKEY_BRANCH }}-${{ matrix.base.os }}" \
            debian/
